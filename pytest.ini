[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q --strict-markers --cov=bham --cov-report=term-missing --cov-report=html:reports/coverage_html --cov-report=xml:reports/coverage.xml --cov-config=pyproject.toml
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
